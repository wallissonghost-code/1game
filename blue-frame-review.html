<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d16"><title>Cavaleiro azul · revisão</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070b12;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}body{padding:max(24px,env(safe-area-inset-top)) 14px 40px}h1{font-size:21px;margin:0 0 5px}p{margin:0 0 18px;color:#95a0b2;font-size:13px}.group{margin:0 0 24px}.group h2{font-size:13px;letter-spacing:.14em;color:#7bb0ff;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{position:relative;min-width:0;aspect-ratio:1/1.02;border:1px solid #26364c;border-radius:14px;background:linear-gradient(180deg,#121b29,#0b111b);overflow:hidden}.card img{width:100%;height:100%;object-fit:contain;display:block}.tag{position:absolute;left:6px;top:6px;padding:4px 6px;border-radius:7px;background:#060a11e8;font-weight:900;font-size:9px;letter-spacing:.06em}.file{position:absolute;left:6px;right:6px;bottom:6px;padding:3px 5px;border-radius:7px;background:#060a11d9;font-size:7px;text-align:center;color:#b8c2d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(min-width:700px){.grid{grid-template-columns:repeat(6,1fr)}body{max-width:1100px;margin:auto}}</style></head><body><h1>🔵 Cavaleiro azul · revisão</h1><p>Os arquivos permanecem separados do vermelho. Compare as três variações de cada número para identificar corrida, ataque e outras poses.</p><main id="root"></main><script>const root=document.getElementById('root');for(let n=1;n<=9;n++){const s=String(n).padStart(3,'0');const g=document.createElement('section');g.className='group';g.innerHTML='<h2>FRAME '+s+'</h2><div class="grid"></div>';const grid=g.querySelector('.grid');[['A','frame_'+s+'.png'],['B','frame_'+s+' 2.png'],['C','frame_'+s+' 3.png']].forEach(([label,file])=>{const c=document.createElement('div');c.className='card';c.innerHTML='<span class="tag">'+label+'</span><img src="./assets/'+encodeURIComponent(file).replace(/%2F/g,'/')+'" alt="'+file+'"><span class="file">'+file+'</span>';grid.appendChild(c)});root.appendChild(g)}</script></body></html>
