<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0e16"><title>1Game</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#080a10;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff}body{position:fixed;inset:0;user-select:none;touch-action:manipulation}button,input{font:inherit}.game{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 35%,#26344c,#131925 34%,#090c13 72%)}.top{text-align:center}.brand{font-weight:950;letter-spacing:.16em;font-size:clamp(23px,7vw,36px)}.sub{font-size:10px;letter-spacing:.28em;color:#9da8bb}.connection-state{margin-top:9px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #ffffff18;border-radius:999px;background:#090d16aa;font-size:9px;font-weight:900;color:#8d98aa}.dot{width:7px;height:7px;border-radius:50%;background:#596272}.connection-state.online{color:#9ef0bd}.connection-state.online .dot{background:#4ade80;box-shadow:0 0 10px #4ade80}.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:130px}.char{position:relative;width:114px;height:232px;animation:idle 2.4s ease-in-out infinite}.head{position:absolute;top:0;left:33px;width:50px;height:56px;border-radius:45%;background:#bd8769;border:3px solid #151922}.hair{position:absolute;top:-2px;left:32px;width:52px;height:24px;border-radius:28px 28px 8px 8px;background:#17191f}.body{position:absolute;top:54px;left:25px;width:67px;height:88px;border-radius:18px;background:#202838;border:3px solid #0d111a}.arm{position:absolute;top:64px;width:24px;height:87px;border-radius:14px;background:#252d3c;border:3px solid #0d111a}.arm.l{left:9px;transform:rotate(7deg)}.arm.r{right:7px;transform:rotate(-7deg)}.leg{position:absolute;top:134px;width:30px;height:94px;border-radius:10px;background:#171d29;border:3px solid #0d111a}.leg.l{left:26px}.leg.r{right:23px}.actions{width:min(100%,420px);display:grid;gap:10px}.pair-box{padding:12px;border:1px solid #ffffff16;border-radius:18px;background:#0b101bcf}.pair-label{display:flex;justify-content:space-between;margin-bottom:8px;font-size:9px;font-weight:950;letter-spacing:.12em;color:#8793a7}.pair-row{display:grid;grid-template-columns:1fr auto;gap:8px}.pair-input{width:100%;min-width:0;height:50px;border:1px solid #37445b;border-radius:13px;background:#080c14;color:#fff;text-align:center;text-transform:uppercase;font-size:18px;font-weight:950;letter-spacing:.16em;outline:none;user-select:text}.connect-btn{height:50px;padding:0 15px;border:0;border-radius:13px;background:#dce4ef;color:#101620;font-size:12px;font-weight:950}.pair-msg{min-height:16px;margin-top:7px;text-align:center;font-size:9px;font-weight:800;color:#718096}.pair-msg.ok{color:#75dfa0}.btn{width:100%;min-height:54px;border:1px solid #ffffff24;border-radius:16px;font-size:16px;font-weight:900;color:#fff;background:#202839}.play{background:#e2e8f0;color:#10141d}.hint{text-align:center;font-size:9px;color:#687387}@keyframes idle{50%{transform:translateY(-5px)}}</style></head><body><main class="game"><header class="top"><div class="brand">1GAME</div><div class="sub">LIVE INTERACTIVE</div><div class="connection-state" id="connectionState"><i class="dot"></i><span>PAINEL DESCONECTADO</span></div></header><section class="stage"><div class="char"><div class="head"></div><div class="hair"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div></section><nav class="actions"><section class="pair-box"><div class="pair-label"><span>ID DO PAINEL</span><b>PAINEL → JOGO</b></div><div class="pair-row"><input id="panelCode" class="pair-input" maxlength="9" placeholder="XXXX-XXXX"><button id="connectPanel" class="connect-btn">CONECTAR</button></div><div class="pair-msg" id="pairMessage">Gere o ID no painel e digite aqui.</div></section><button class="btn play" id="play">▶ JOGAR / INICIAR</button><button class="btn">🏆 CONQUISTAS</button><div class="hint">Ao iniciar, a partida começa imediatamente.</div></nav></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://wallissonghost-code.github.io/projeto-daniel/sdk/liveplus-game-sdk-v1.js?v=1.0.0"></script><script src="js/vendor/liveplus-game-sdk-v1.js?v=1.0.0-fallback1"></script><script src="js/onegame-liveplus-peer-compat.js?v=1.0.0"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),input=$('panelCode'),msg=$('pairMessage'),state=$('connectionState');let peer=null,conn=null,code='',token='';const clean=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8),format=v=>{v=clean(v);return v.length>4?v.slice(0,4)+'-'+v.slice(4):v},target=v=>'liveplus-session-'+clean(v).toLowerCase(),clientId=v=>'1game-client-'+clean(v).toLowerCase();function setState(t,on=false){state.querySelector('span').textContent=t;state.classList.toggle('online',on)}function connect(){const c=clean(input.value);input.value=format(c);if(c.length!==8){msg.textContent='Digite os 8 caracteres do painel.';return}code=c;try{peer?.destroy()}catch{}setState('CONECTANDO...');peer=new Peer(clientId(c),{debug:0});peer.on('open',()=>{conn=peer.connect(target(c),{reliable:true,serialization:'json'});conn.on('open',()=>{msg.textContent='Canal encontrado. Autorizando...';conn.send({type:'session_hello',protocol:'liveplus-match-v1',token:token||undefined})});conn.on('data',d=>{if(d?.type==='session_accept'){token=String(d.token||'');try{sessionStorage.setItem('1game-panel-code',format(c));sessionStorage.setItem('1game-session-token',token)}catch{}setState('PAINEL CONECTADO',true);msg.textContent='Conectado ao painel · '+format(c);msg.className='pair-msg ok'}});conn.on('close',()=>setState('PAINEL DESCONECTADO'))});peer.on('error',e=>{setState('PAINEL DESCONECTADO');msg.textContent=e?.type==='unavailable-id'?'Reconecte em alguns segundos.':'Não foi possível conectar.'})}input.addEventListener('input',()=>input.value=format(input.value));$('connectPanel').onclick=connect;$('play').onclick=()=>{const c=format(code||input.value);if(c)try{sessionStorage.setItem('1game-panel-code',c);sessionStorage.setItem('1game-session-token',token)}catch{}try{sessionStorage.setItem('1game-handoff','1')}catch{}location.href='game.html'};document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches?.length>1)e.preventDefault()},{passive:false})})();</script></body></html>
