<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e16" />
  <title>1Game</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#080a10;touch-action:manipulation;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff}
    body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
    .game{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#26344c 0,#131925 35%,#090c13 72%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(28px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom))}
    .game:before{content:"";position:absolute;left:-25%;right:-25%;bottom:-10%;height:46%;background:radial-gradient(ellipse at center,#263147 0,#111722 48%,transparent 70%);transform:perspective(500px) rotateX(62deg);opacity:.9}
    .top{z-index:2;text-align:center}.brand{font-weight:900;letter-spacing:.16em;font-size:clamp(24px,8vw,38px);text-shadow:0 4px 20px #000}.sub{font-size:12px;letter-spacing:.28em;color:#9da8bb;margin-top:5px}
    .stage{z-index:2;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
    .shadow{position:absolute;width:130px;height:28px;border-radius:50%;background:#000;filter:blur(9px);opacity:.5;transform:translateY(132px)}
    .char{position:relative;width:120px;height:245px;animation:idle 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 16px #0008)}
    .head{position:absolute;top:0;left:35px;width:52px;height:59px;border-radius:45% 45% 48% 48%;background:linear-gradient(135deg,#d9ad8b,#9d684f);border:3px solid #151922}.hair{position:absolute;top:-2px;left:34px;width:54px;height:25px;border-radius:28px 28px 8px 8px;background:#17191f}.body{position:absolute;top:57px;left:26px;width:70px;height:92px;border-radius:18px 18px 13px 13px;background:linear-gradient(135deg,#2d3546,#151b28);border:3px solid #0d111a}.arm{position:absolute;top:67px;width:25px;height:91px;border-radius:14px;background:#252d3c;border:3px solid #0d111a;transform-origin:top}.arm.l{left:10px;transform:rotate(7deg)}.arm.r{right:8px;transform:rotate(-7deg)}.leg{position:absolute;top:140px;width:31px;height:98px;border-radius:10px 10px 15px 15px;background:#171d29;border:3px solid #0d111a}.leg.l{left:28px}.leg.r{right:24px}.shoe{position:absolute;bottom:-4px;width:39px;height:20px;border-radius:8px 13px 7px 7px;background:#080a0e}.leg.l .shoe{right:0}.leg.r .shoe{left:0}
    .actions{z-index:3;width:min(100%,420px);display:grid;gap:12px}.btn{width:100%;min-height:58px;border:1px solid #ffffff24;border-radius:17px;font-size:17px;font-weight:800;letter-spacing:.04em;color:white;background:#202839;box-shadow:0 10px 25px #0006;touch-action:manipulation}.play{background:linear-gradient(180deg,#f5f7fb,#cbd3df);color:#10141d;border-color:white;box-shadow:0 10px 30px #dbe6ff24}.btn:active{transform:scale(.98)}
    .hint{text-align:center;font-size:11px;color:#687387;margin-top:2px}
    @keyframes idle{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.char{animation:none}}
  </style>
</head>
<body>
  <main class="game" id="game">
    <header class="top"><div class="brand">1GAME</div><div class="sub">LIVE INTERACTIVE</div></header>
    <section class="stage" aria-label="Personagem"><div class="shadow"></div><div class="char" aria-hidden="true"><div class="head"></div><div class="hair"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"><i class="shoe"></i></div><div class="leg r"><i class="shoe"></i></div></div></section>
    <nav class="actions"><button class="btn play" id="play" type="button">▶ JOGAR</button><button class="btn" id="achievements" type="button">🏆 CONQUISTAS</button><div class="hint">Protótipo do lobby</div></nav>
  </main>
  <script>
    const stopZoom=e=>{if(e.touches&&e.touches.length>1)e.preventDefault()};
    document.addEventListener('touchmove',stopZoom,{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
    let last=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-last<=300)e.preventDefault();last=now},{passive:false});
    document.getElementById('play').addEventListener('click',()=>alert('Jogo será conectado aqui.'));
    document.getElementById('achievements').addEventListener('click',()=>alert('Conquistas serão exibidas aqui.'));
  </script>
</body>
</html>
