name: Battlefield Performance V1
on:
  push:
    paths:
      - '.github/workflows/battlefield-performance-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize battlefield runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          original=s

          # CSS: GPU movement + containment + adaptive visual LOD.
          s=s.replace(
            ".unit{position:absolute;width:20px;height:28px;z-index:3}",
            ".unit{position:absolute;left:0;top:0;width:20px;height:28px;z-index:3;will-change:transform;contain:layout paint style}"
          )
          s=s.replace(
            ".unit.red.fight .mob-sprite,.unit.blue.fight .mob-sprite{filter:drop-shadow(0 4px 4px #0008) brightness(1.08)}",
            ".unit.red.fight .mob-sprite,.unit.blue.fight .mob-sprite{filter:drop-shadow(0 4px 4px #0008) brightness(1.08)}.battle.perf-high .mob-sprite{filter:none!important}.battle.perf-high .unit.red.fight .mob-sprite,.battle.perf-high .unit.blue.fight .mob-sprite{filter:none!important}"
          )

          old="""function enemyNear(u){let e=null,d=1e9;for(const v of units){if(v.hp<=0||v.team===u.team)continue;const nd=Math.hypot(v.x-u.x,v.y-u.y);if(nd<d){d=nd;e=v}}return{e,d}}function animateUnit(u,dt,moving,targetX){const img=u.el.querySelector('.mob-sprite');if(!img)return;const frames=u.team==='red'?RED_FRAMES:BLUE_FRAMES;const dir=targetX<u.x?-1:1;const native=u.team==='red'?1:-1;u.facing=dir;u.anim+=dt;if(moving&&u.anim>=.085){u.anim=0;u.frame=(u.frame+1)%frames.length;img.src=frames[u.frame]}else if(!moving&&u.anim>=.14){u.anim=0;u.frame=(u.frame+1)%frames.length;img.src=frames[u.frame]}img.style.transform=`scaleX(${dir*native})`}function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(const u of units){if(u.hp<=0)continue;u.atk-=dt;const own=castlePoint(u.team),targetCastle=castlePoint(u.team==='red'?'blue':'red'),near=enemyNear(u),enemy=near.e;let target=null;if(enemy&&near.d<=SIGHT)target=enemy;else target=targetCastle;if(enemy&&enemy.attackingCastle&&Math.hypot(u.x-own.x,u.y-own.y)<150)target=enemy;const tx=target.x,ty=target.y,d=Math.hypot(tx-u.x,ty-u.y),isCastle=target===targetCastle;let moving=false;if(!isCastle&&d<=UNIT_RANGE){u.attackingCastle=false;u.el.classList.add('fight');if(u.atk<=0){u.atk=ATTACK_CD;target.hp-=UNIT_DAMAGE;if(target.hp<=0)kill(target)}}else if(isCastle&&d<=CASTLE_RANGE){u.attackingCastle=true;u.el.classList.add('fight');if(u.atk<=0){u.atk=ATTACK_CD;hitCastle(u.team==='red'?'blue':'red',CASTLE_DAMAGE)}}else{moving=true;u.attackingCastle=false;u.el.classList.remove('fight');if(d>1){u.x+=(tx-u.x)/d*UNIT_SPEED*dt;u.y+=(ty-u.y)/d*UNIT_SPEED*dt}}animateUnit(u,dt,moving,tx);u.el.style.left=u.x+'px';u.el.style.top=u.y+'px'}units=units.filter(u=>u.el.isConnected);requestAnimationFrame(loop)}"""

          new="""const PERF_CELL=72,AI_TICK=.055,HUD_TICK=.12,CLEANUP_TICK=.55;let aiClock=0,hudClock=0,cleanupClock=0,perfFrames=0,perfFps=60,perfWindow=performance.now(),perfMode=0,spatial=new Map(),castleAttackers={red:null,blue:null};const cellKey=(x,y)=>((x/PERF_CELL)|0)+','+((y/PERF_CELL)|0);function rebuildSpatial(){spatial.clear();castleAttackers={red:null,blue:null};let alive=0;for(const u of units){if(u.hp<=0)continue;alive++;const k=cellKey(u.x,u.y);let a=spatial.get(k);if(!a)spatial.set(k,a=[]);a.push(u);if(u.attackingCastle){const victim=u.team==='red'?'blue':'red';castleAttackers[victim]=u}}battle.classList.toggle('perf-high',alive>=80||perfMode>0);return alive}function enemyNear(u){let best=null,best2=SIGHT*SIGHT;const cx=(u.x/PERF_CELL)|0,cy=(u.y/PERF_CELL)|0,r=Math.ceil(SIGHT/PERF_CELL);for(let gx=cx-r;gx<=cx+r;gx++)for(let gy=cy-r;gy<=cy+r;gy++){const a=spatial.get(gx+','+gy);if(!a)continue;for(const v of a){if(v.hp<=0||v.team===u.team)continue;const dx=v.x-u.x,dy=v.y-u.y,d2=dx*dx+dy*dy;if(d2<best2){best2=d2;best=v}}}return best}function chooseTargets(){rebuildSpatial();for(const u of units){if(u.hp<=0)continue;const own=castlePoint(u.team),targetCastle=castlePoint(u.team==='red'?'blue':'red');let target=enemyNear(u);if(!target){const defender=castleAttackers[u.team];if(defender&&defender.hp>0&&Math.hypot(u.x-own.x,u.y-own.y)<150)target=defender}u.target=target||targetCastle;u.targetIsCastle=!target}}function animateUnit(u,dt,moving,targetX){const img=u.img;if(!img)return;const frames=u.team==='red'?RED_FRAMES:BLUE_FRAMES,dir=targetX<u.x?-1:1,native=u.team==='red'?1:-1;if(u.facing!==dir){u.facing=dir;img.style.transform=`scaleX(${dir*native})`}u.anim+=dt;const alive=perfAlive,interval=perfMode===2?.30:perfMode===1?.19:(alive>160?.16:.09);if(u.anim>=interval){u.anim=0;if(moving||perfMode===0){u.frame=(u.frame+1)%frames.length;const src=frames[u.frame];if(img.dataset.src!==src){img.dataset.src=src;img.src=src}}}}let perfAlive=0;function tunePerf(now){perfFrames++;if(now-perfWindow<800)return;perfFps=Math.max(1,Math.round(perfFrames*1000/(now-perfWindow)));perfFrames=0;perfWindow=now;const n=perfAlive;perfMode=(perfFps<42||n>=220)?2:(perfFps<54||n>=90)?1:0;window.__battlePerf={fps:perfFps,mobs:n,mode:perfMode}}function loop(now){if(document.hidden){last=now;requestAnimationFrame(loop);return}const dt=Math.min(.05,(now-last)/1000);last=now;aiClock+=dt;hudClock+=dt;cleanupClock+=dt;if(aiClock>=AI_TICK){aiClock=0;chooseTargets();perfAlive=0;for(const u of units)if(u.hp>0)perfAlive++}for(const u of units){if(u.hp<=0)continue;u.atk-=dt;let target=u.target;if(!target||(!u.targetIsCastle&&target.hp<=0)){target=castlePoint(u.team==='red'?'blue':'red');u.target=target;u.targetIsCastle=true}const tx=target.x,ty=target.y,dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy),isCastle=!!u.targetIsCastle;let moving=false;if(!isCastle&&d<=UNIT_RANGE){u.attackingCastle=false;if(!u.fighting){u.fighting=true;u.el.classList.add('fight')}if(u.atk<=0){u.atk=ATTACK_CD;target.hp-=UNIT_DAMAGE;if(target.hp<=0)kill(target)}}else if(isCastle&&d<=CASTLE_RANGE){u.attackingCastle=true;if(!u.fighting){u.fighting=true;u.el.classList.add('fight')}if(u.atk<=0){u.atk=ATTACK_CD;hitCastle(u.team==='red'?'blue':'red',CASTLE_DAMAGE)}}else{moving=true;u.attackingCastle=false;if(u.fighting){u.fighting=false;u.el.classList.remove('fight')}if(d>1){u.x+=dx/d*UNIT_SPEED*dt;u.y+=dy/d*UNIT_SPEED*dt}}animateUnit(u,dt,moving,tx);u.el.style.transform=`translate3d(${u.x}px,${u.y}px,0)`}if(hudClock>=HUD_TICK){hudClock=0;update()}if(cleanupClock>=CLEANUP_TICK){cleanupClock=0;units=units.filter(u=>u.hp>0||u.el.isConnected)}tunePerf(now);requestAnimationFrame(loop)}"""
          if old not in s:
            raise SystemExit('PATCH MISS: enemy/animation/loop block')
          s=s.replace(old,new)

          old_spawn="""const frames=team==='red'?RED_FRAMES:BLUE_FRAMES;el.innerHTML=`<img class=\"mob-sprite\" src=\"${frames[0]}\" alt=\"\">`;battle.appendChild(el);units.push({el,team,x:p.x,y:p.y,hp:UNIT_HP,atk:0,counted:false,attackingCastle:false,frame:0,anim:Math.random()*.09,facing:team==='red'?1:-1})"""
          new_spawn="""const frames=team==='red'?RED_FRAMES:BLUE_FRAMES;el.innerHTML=`<img class=\"mob-sprite\" src=\"${frames[0]}\" alt=\"\">`;battle.appendChild(el);const img=el.firstElementChild;img.dataset.src=frames[0];el.style.transform=`translate3d(${p.x}px,${p.y}px,0)`;units.push({el,img,team,x:p.x,y:p.y,hp:UNIT_HP,atk:0,counted:false,attackingCastle:false,fighting:false,target:null,targetIsCastle:false,frame:0,anim:Math.random()*.09,facing:team==='red'?1:-1})"""
          if old_spawn not in s:
            raise SystemExit('PATCH MISS: spawn object')
          s=s.replace(old_spawn,new_spawn)

          # Throttle state traffic; mass castle hits no longer spam WebRTC.
          old_state="""function sendState(){if(conn?.open)try{conn.send({type:'state',gameId:'1game-battlefield',red:{units:units.filter(u=>u.team==='red'&&u.hp>0).length,hp:redHp},blue:{units:units.filter(u=>u.team==='blue'&&u.hp>0).length,hp:blueHp},at:Date.now()})}catch{}}"""
          new_state="""let stateQueued=false,lastStateSent=0;function sendState(force=false){if(!conn?.open)return;const now=performance.now(),wait=Math.max(0,120-(now-lastStateSent));if(!force&&wait>0){if(!stateQueued){stateQueued=true;setTimeout(()=>{stateQueued=false;sendState(true)},wait)}return}lastStateSent=performance.now();try{conn.send({type:'state',gameId:'1game-battlefield',red:{units:units.filter(u=>u.team==='red'&&u.hp>0).length,hp:redHp},blue:{units:units.filter(u=>u.team==='blue'&&u.hp>0).length,hp:blueHp},at:Date.now()})}catch{}}"""
          if old_state not in s:
            raise SystemExit('PATCH MISS: sendState')
          s=s.replace(old_state,new_state)

          # Death HUD updates are handled by throttled loop instead of N DOM updates in same frame.
          s=s.replace("u.el.classList.add('dead');setTimeout(()=>u.el.remove(),350);update()", "u.el.classList.add('dead');setTimeout(()=>u.el.remove(),350)")

          p.write_text(s)
          print('Battlefield performance V1 applied')
          PY
      - name: Sanity checks
        run: |
          grep -q "PERF_CELL=72" game.html
          grep -q "translate3d" game.html
          grep -q "window.__battlePerf" game.html
          grep -q "stateQueued" game.html
      - name: Commit
        run: |
          git config user.name ghostzinho
          git config user.email wallissonghost@gmail.com
          git add game.html
          git commit -m "perf: spatial grid, GPU movement and adaptive mob LOD"
          git push