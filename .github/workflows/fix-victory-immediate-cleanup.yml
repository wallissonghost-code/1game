name: Fix victory immediate cleanup
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-victory-immediate-cleanup.yml'
      - 'scripts/fix-victory-immediate-cleanup.py'
      - 'scripts/victory-cleanup-qa.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only victory cleanup fix
        run: python3 scripts/fix-victory-immediate-cleanup.py
      - name: Install QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Critical release gate
        run: npm run check:release
      - name: Victory first-frame cleanup QA
        run: node scripts/victory-cleanup-qa.mjs
      - name: Commit tested game locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: limpar unidades antes do overlay de vitória'
          fi
      - name: Rebase onto latest dev and revalidate victory cleanup
        run: |
          git fetch origin dev
          git rebase origin/dev
          node scripts/victory-cleanup-qa.mjs
      - name: Push tested build to dev
        run: |
          for attempt in 1 2 3; do
            git fetch origin dev
            if git rebase origin/dev && node scripts/victory-cleanup-qa.mjs && git push origin HEAD:dev; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Promote exact tested build to main
        run: git push origin HEAD:main
