name: Paladin directional animation
on:
  push:
    paths:
      - '.github/workflows/paladin-directional-animation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch directional paladin animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text(encoding='utf-8')

          marker='/* paladin-directional-v1 */'
          if marker in s:
              raise SystemExit('already patched')

          # Frames are treated as 8 directional groups x 4 animation frames.
          anchor="const PALADIN_BLUE_FRAMES=Array.from({length:32},(_,i)=>`./assets/mobs/boss/blue/frame_${String(i+1).padStart(3,'0')}.png`);"
          insert="""const PALADIN_BLUE_FRAMES=Array.from({length:32},(_,i)=>`./assets/mobs/boss/blue/frame_${String(i+1).padStart(3,'0')}.png`);/* paladin-directional-v1 */const PALADIN_DIRS={s:[0,1,2,3],se:[4,5,6,7],e:[8,9,10,11],ne:[12,13,14,15],n:[16,17,18,19],nw:[20,21,22,23],w:[24,25,26,27],sw:[28,29,30,31]};"""
          if anchor not in s: raise SystemExit('paladin frame anchor not found')
          s=s.replace(anchor,insert,1)

          # Give Paladin its own stable directional state.
          old="kind:'paladin',frames:PALADIN_BLUE_FRAMES,x:p.x"
          new="kind:'paladin',frames:PALADIN_BLUE_FRAMES,palDir:'w',palDirCandidate:'w',palDirTicks:0,x:p.x"
          if old not in s: raise SystemExit('paladin spawn anchor not found')
          s=s.replace(old,new,1)

          # Helper: quantize movement vector into 8 directions and require persistence before changing.
          helper="""
          function paladinDirection(u,dx,dy){
            if(Math.abs(dx)<.35&&Math.abs(dy)<.35)return u.palDir||'w';
            const a=Math.atan2(dy,dx)*180/Math.PI;
            let d='e';
            if(a>=-22.5&&a<22.5)d='e';
            else if(a>=22.5&&a<67.5)d='se';
            else if(a>=67.5&&a<112.5)d='s';
            else if(a>=112.5&&a<157.5)d='sw';
            else if(a>=157.5||a<-157.5)d='w';
            else if(a>=-157.5&&a<-112.5)d='nw';
            else if(a>=-112.5&&a<-67.5)d='n';
            else d='ne';
            if(d===u.palDir){u.palDirCandidate=d;u.palDirTicks=0;return d}
            if(d!==u.palDirCandidate){u.palDirCandidate=d;u.palDirTicks=1;return u.palDir||d}
            u.palDirTicks=(u.palDirTicks||0)+1;
            if(u.palDirTicks>=3){u.palDir=d;u.palDirTicks=0}
            return u.palDir||d;
          }
          """
          anchor2="function animateUnit(u,dt,moving,targetX){"
          if anchor2 not in s: raise SystemExit('animate function anchor not found')
          s=s.replace(anchor2,helper+anchor2,1)

          old_anim="function animateUnit(u,dt,moving,targetX){const img=u.img;if(!img)return;const frames=u.frames||(u.team==='red'?RED_FRAMES:BLUE_FRAMES),dir=targetX<u.x?-1:1,native=u.team==='red'?1:-1;if(u.facing!==dir){u.facing=dir;img.style.transform=`scaleX(${dir*native})`}u.anim+=dt;const alive=perfAlive,interval=perfMode===2?.30:perfMode===1?.19:(alive>160?.16:.09);if(u.anim>=interval){u.anim=0;if(moving||perfMode===0){u.frame=(u.frame+1)%frames.length;const src=frames[u.frame];if(img.dataset.src!==src){img.dataset.src=src;img.src=src}}}}"
          new_anim="""function animateUnit(u,dt,moving,targetX){const img=u.img;if(!img)return;if(u.kind==='paladin'){const dx=Number.isFinite(u.animDx)?u.animDx:(targetX-u.x),dy=Number.isFinite(u.animDy)?u.animDy:0,dirName=paladinDirection(u,dx,dy),group=PALADIN_DIRS[dirName]||PALADIN_DIRS.w;img.style.transform='scaleX(1)';u.anim+=dt;const interval=moving?.075:.12;if(u.anim>=interval){u.anim=0;u.frame=((u.frame||0)+1)%group.length;const src=PALADIN_BLUE_FRAMES[group[u.frame]];if(img.dataset.src!==src){img.dataset.src=src;img.src=src}}return}const frames=u.frames||(u.team==='red'?RED_FRAMES:BLUE_FRAMES),dir=targetX<u.x?-1:1,native=u.team==='red'?1:-1;if(u.facing!==dir){u.facing=dir;img.style.transform=`scaleX(${dir*native})`}u.anim+=dt;const alive=perfAlive,interval=perfMode===2?.30:perfMode===1?.19:(alive>160?.16:.09);if(u.anim>=interval){u.anim=0;if(moving||perfMode===0){u.frame=(u.frame+1)%frames.length;const src=frames[u.frame];if(img.dataset.src!==src){img.dataset.src=src;img.src=src}}}}"""
          if old_anim not in s: raise SystemExit('exact animateUnit block not found')
          s=s.replace(old_anim,new_anim,1)

          # Feed actual target vector to animation; when stopped/fighting it keeps orientation toward target.
          old_call="animateUnit(u,dt,moving,tx);u.el.style.transform=`translate3d(${u.x}px,${u.y}px,0)`"
          new_call="u.animDx=rawTx-u.x;u.animDy=rawTy-u.y;animateUnit(u,dt,moving,tx);u.el.style.transform=`translate3d(${u.x}px,${u.y}px,0)`"
          if old_call not in s: raise SystemExit('animate call anchor not found')
          s=s.replace(old_call,new_call,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q "paladin-directional-v1" game.html
          grep -q "PALADIN_DIRS" game.html
          grep -q "function paladinDirection" game.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html
          git diff --cached --quiet || git commit -m "fix: Paladino Azul usa frames por direção"
          git push