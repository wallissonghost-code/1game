name: Fix asset structure
on:
  push:
    paths:
      - '.github/workflows/fix-asset-structure.yml'
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar mobs por cor
        shell: bash
        run: |
          set -e
          mkdir -p assets/mobs/red assets/mobs/blue assets/mobs/boss/red assets/mobs/boss/blue

          shopt -s nullglob
          for f in assets/mobs/frame_*.png; do
            git mv "$f" assets/mobs/red/
          done
          for f in assets/frame_*.png; do
            git mv "$f" assets/mobs/blue/
          done
          for f in assets/mobs/boss/blue/paladin/frame_*.png; do
            git mv "$f" assets/mobs/blue/
          done

          if [ -f assets/mobs/boss/blue/paladin/README.md ]; then git rm assets/mobs/boss/blue/paladin/README.md; fi

          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./assets/mobs/frame_', './assets/mobs/red/frame_')
          s=s.replace('assets/mobs/frame_', 'assets/mobs/red/frame_')
          s=s.replace('./assets/frame_', './assets/mobs/blue/frame_')
          s=s.replace('assets/frame_', 'assets/mobs/blue/frame_')
          p.write_text(s, encoding='utf-8')

          Path('assets/mobs/README.md').write_text('''# Mobs\n\nEstrutura atual:\n\n- `red/` — todos os frames do Cavaleiro/Mob Vermelho.\n- `blue/` — todos os frames do Cavaleiro/Mob Azul.\n- `boss/red/` — reservado para futuros bosses/especiais Vermelhos.\n- `boss/blue/` — reservado para futuros bosses/especiais Azuis.\n\nPaladinos ainda não foram adicionados ao projeto.\n''', encoding='utf-8')

          Path('assets/mobs/boss/README.md').write_text('''# Bosses\n\nPastas reservadas. Ainda não existem skins de Boss ou Paladino no projeto.\n\n- `red/` — futuros bosses/especiais Vermelhos.\n- `blue/` — futuros bosses/especiais Azuis.\n''', encoding='utf-8')
          PY

          git rm .github/workflows/organize-boss-assets.yml || true
          git rm .github/workflows/fix-asset-structure.yml

      - name: Validar estrutura
        shell: bash
        run: |
          test -d assets/mobs/red
          test -d assets/mobs/blue
          test ! -d assets/mobs/boss/blue/paladin || test -z "$(find assets/mobs/boss/blue/paladin -type f -print -quit)"
          ! find assets -maxdepth 1 -type f -name 'frame_*.png' | grep -q .
          ! find assets/mobs -maxdepth 1 -type f -name 'frame_*.png' | grep -q .
          grep -q 'assets/mobs/red/frame_' game.html
          grep -q 'assets/mobs/blue/frame_' game.html

      - name: Commit
        shell: bash
        run: |
          git config user.name ghostzinho
          git config user.email wallissonghost@gmail.com
          git add -A
          git commit -m "chore: separar mobs vermelho e azul corretamente"
          git push