name: Install LivePlus SDK v1
on:
  push:
    paths:
      - '.github/workflows/install-liveplus-sdk-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 1Game pages
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='onegame-liveplus-peer-compat.js'
          scripts='<script src="https://wallissonghost-code.github.io/projeto-daniel/sdk/liveplus-game-sdk-v1.js?v=1.0.0"></script><script src="js/vendor/liveplus-game-sdk-v1.js?v=1.0.0-fallback1"></script><script src="js/onegame-liveplus-peer-compat.js?v=1.0.0"></script>'
          for name in ('index.html','game.html'):
              p=Path(name)
              s=p.read_text()
              if marker in s:
                  continue
              needle='<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>'
              if needle not in s:
                  raise SystemExit(f'PeerJS marker not found in {name}')
              s=s.replace(needle, needle+scripts, 1)
              p.write_text(s)
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game.html
          git commit -m "Migrate 1Game to Live+ SDK v1 with fallback"
          git push
