name: Fix paladin facing and castle contact
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-paladin-facing-contact.yml'
      - 'scripts/fix-paladin-facing-contact.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused gameplay fix
        run: python3 scripts/fix-paladin-facing-contact.py
      - name: Install QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Critical release gate on patched tree
        run: npm run check:release
      - name: Gameplay QA on patched tree
        run: npm run check:gameplay
      - name: Commit exact tested game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: paladino 4 direções x 8 frames validado'
            git push origin HEAD:dev
          fi
      - name: Promote exact tested tree to main
        run: git push origin HEAD:main
