name: Promote tested dev to main
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  gate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stamp approved build version
        env:
          GAME_BUILD_PATCH: ${{ github.run_number }}
        run: python3 scripts/stamp-version.py
      - name: Install QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Critical release gate
        run: npm run check:release
      - name: Gameplay QA
        run: npm run check:gameplay
      - name: Commit exact tested build to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html
          if ! git diff --cached --quiet; then
            git commit -m "build: BETA 0.2.${{ github.run_number }} aprovado pelo QA"
            git push origin HEAD:dev
          fi
      - name: Promote exact tested build to main
        run: git push origin HEAD:main
