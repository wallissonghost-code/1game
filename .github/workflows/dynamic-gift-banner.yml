name: Improve gift HUD
on:
  push:
    paths:
      - '.github/workflows/dynamic-gift-banner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove wasted space below HUD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          css='''\n<style id="hud-auto-height-v1">\n/* Let the footer use only the height its content actually needs. */\n.game{grid-template-rows:auto minmax(0,1fr) auto!important}.livebar{min-height:0!important;height:auto!important;align-self:end!important}.sides,.side,.rules,.team-comment{min-height:0}.side{height:auto!important}.side .rules{flex:none!important}.team-comment{margin-bottom:0!important}.livebar{padding-bottom:max(8px,env(safe-area-inset-bottom))!important}\n@media(orientation:portrait){.game{grid-template-rows:auto minmax(0,1fr) auto!important}}\n@media(orientation:landscape){.game{grid-template-rows:auto minmax(0,1fr) auto!important}}\n</style>\n'''
          if 'id="hud-auto-height-v1"' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Check
        run: grep -q 'hud-auto-height-v1' game.html
      - name: Commit
        run: |
          git config user.name ghostzinho
          git config user.email wallissonghost@gmail.com
          git add game.html
          git commit -m "ui: remover espaço vazio abaixo do HUD"
          git push