name: Beta label timer
on:
  push:
    paths:
      - '.github/workflows/dynamic-gift-banner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add beta version above timer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          css='''\n<style id="beta-version-v020">\n.timerbox{position:relative!important;margin-top:10px!important}\n.timerbox:before{content:"BETA 0.2.0";position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);font-size:5.5px;line-height:1;font-weight:950;letter-spacing:.16em;color:#7f8a9a;white-space:nowrap;text-shadow:0 1px 4px #000}\n</style>\n'''
          if 'id="beta-version-v020"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Check
        run: grep -q 'BETA 0.2.0' game.html
      - name: Commit
        run: |
          git config user.name ghostzinho
          git config user.email wallissonghost@gmail.com
          git add game.html
          git commit -m "ui: exibir Beta 0.2.0 acima do timer"
          git push