name: Timer controls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dynamic-gift-banner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pause and lobby controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()

          css='''\n<style id="timer-controls-v1">\n.timerbox{position:relative!important;overflow:visible!important}.timer-control{position:absolute;top:50%;transform:translateY(-50%);width:31px;height:31px;padding:0;border:1px solid #ffffff1c;border-radius:9px;background:rgba(11,17,28,.94);color:#dce5f2;display:grid;place-items:center;font-size:13px;font-weight:950;box-shadow:0 5px 14px #0006,inset 0 1px 0 #ffffff0a;z-index:3}.timer-control:active{transform:translateY(-50%) scale(.94)}#lobbyBtn{right:calc(100% + 6px)}#pauseGameBtn{left:calc(100% + 6px)}#pauseGameBtn.paused{color:#ffe19a;border-color:#e4bd5b55;background:#211b0f}.timerbox .pause-label{display:none}\n@media(max-width:360px){.timer-control{width:28px;height:28px;font-size:12px}#lobbyBtn{right:calc(100% + 4px)}#pauseGameBtn{left:calc(100% + 4px)}}\n</style>\n'''
          if 'id="timer-controls-v1"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          old='<div class="timerbox"><b id="timer">01:30</b><small id="linkStatus">PAINEL...</small></div>'
          new='<div class="timerbox"><button class="timer-control" id="lobbyBtn" type="button" aria-label="Voltar ao lobby">↩</button><b id="timer">01:30</b><small id="linkStatus">PAINEL...</small><button class="timer-control" id="pauseGameBtn" type="button" aria-label="Pausar partida">Ⅱ</button></div>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'id="pauseGameBtn"' not in s:
              raise SystemExit('timerbox anchor not found')

          # Add paused state to the main game scope.
          old_state='blueStars=Number(sessionStorage.getItem(\'1game-blue-stars\')||0),peer=null,conn=null;'
          new_state='blueStars=Number(sessionStorage.getItem(\'1game-blue-stars\')||0),paused=false,peer=null,conn=null;'
          if old_state in s:
              s=s.replace(old_state,new_state,1)
          elif 'paused=false,peer=null' not in s:
              raise SystemExit('state anchor not found')

          # Freeze simulation while paused, but keep RAF alive.
          old_loop='function loop(now){if(document.hidden){last=now;requestAnimationFrame(loop);return}const dt='
          new_loop='function loop(now){if(document.hidden){last=now;requestAnimationFrame(loop);return}if(paused){last=now;requestAnimationFrame(loop);return}const dt='
          if old_loop in s:
              s=s.replace(old_loop,new_loop,1)
          elif 'if(paused){last=now;requestAnimationFrame(loop);return}' not in s:
              raise SystemExit('loop anchor not found')

          # Pause the countdown too.
          s=s.replace('if(!ended&&time>0){time=Math.max(0,time-1);','if(!ended&&!paused&&time>0){time=Math.max(0,time-1);',1)

          # Wire buttons from inside the same IIFE so they can access paused.
          anchor='loadAssets();updateStars();reset();connect();'
          wire="""const lobbyBtn=$('lobbyBtn'),pauseBtn=$('pauseGameBtn');if(lobbyBtn)lobbyBtn.addEventListener('click',()=>{location.href='./index.html'});if(pauseBtn)pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.classList.toggle('paused',paused);pauseBtn.textContent=paused?'▶':'Ⅱ';pauseBtn.setAttribute('aria-label',paused?'Continuar partida':'Pausar partida');$('linkStatus').textContent=paused?'PAUSADO':(conn?.open?'PAINEL ON':'PAINEL...')});loadAssets();updateStars();reset();connect();"""
          if anchor in s:
              s=s.replace(anchor,wire,1)
          elif "pauseBtn.textContent=paused?'▶':'Ⅱ'" not in s:
              raise SystemExit('wire anchor not found')

          p.write_text(s)
          PY
      - name: Check
        run: |
          grep -q 'timer-controls-v1' game.html
          grep -q 'id="lobbyBtn"' game.html
          grep -q 'id="pauseGameBtn"' game.html
          grep -q 'if(paused)' game.html
      - name: Commit
        run: |
          git config user.name ghostzinho
          git config user.email wallissonghost@gmail.com
          git add game.html
          git commit -m "ui: adicionar pause e retorno ao lobby no timer" || exit 0
          git push