name: Paladin visual audit
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/paladin-visual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build visual contact sheet from real PNGs
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          folder=Path('assets/mobs/special/paladin/blue')
          files=[folder/f'frame_{i:03}.png' for i in range(1,33)]
          thumbs=[]
          for i,p in enumerate(files,1):
              im=Image.open(p).convert('RGBA')
              bbox=im.getbbox()
              if bbox: im=im.crop(bbox)
              im.thumbnail((180,180), Image.Resampling.LANCZOS)
              cell=Image.new('RGBA',(220,220),(235,235,235,255))
              x=(220-im.width)//2; y=12+(180-im.height)//2
              cell.alpha_composite(im,(x,y))
              d=ImageDraw.Draw(cell)
              d.rectangle((0,0,219,219),outline=(80,80,80,255),width=1)
              d.text((8,194),f'frame_{i:03}.png',fill=(0,0,0,255))
              thumbs.append(cell.convert('RGB'))
          sheet=Image.new('RGB',(220*8,220*4),(255,255,255))
          for idx,cell in enumerate(thumbs): sheet.paste(cell,((idx%8)*220,(idx//8)*220))
          sheet.save('paladin-32-contact-sheet.png',quality=95)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paladin-32-contact-sheet
          path: paladin-32-contact-sheet.png
