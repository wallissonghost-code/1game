<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>1Game · Revisão de Frames</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070b12;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}body{padding:14px}.top{position:sticky;top:0;z-index:5;background:#070b12eF;backdrop-filter:blur(10px);padding:8px 0 12px}.top h1{font-size:16px;margin:0}.top p{font-size:11px;color:#8f9aab;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{position:relative;aspect-ratio:1/1.08;border:1px solid #ffffff18;border-radius:12px;background:linear-gradient(180deg,#141c29,#0c121c);display:flex;align-items:center;justify-content:center;overflow:hidden}.card img{width:92%;height:92%;object-fit:contain;image-rendering:auto}.tag{position:absolute;left:6px;top:6px;padding:4px 7px;border-radius:7px;background:#000c;font-size:10px;font-weight:900;letter-spacing:.05em}.meta{position:absolute;right:6px;bottom:6px;padding:3px 6px;border-radius:6px;background:#000a;color:#b7c1cf;font-size:8px}@media(max-width:390px){body{padding:8px}.grid{gap:5px}.tag{font-size:9px;padding:3px 5px}}</style></head><body><header class="top"><h1>⚔️ Cavaleiro vermelho · revisão</h1><p>Frames exibidos sem alterar ordem ou proporção. Use esta tela para classificar direção e sequência.</p></header><main class="grid" id="grid"></main><script>const grid=document.getElementById('grid');for(let n=1;n<=9;n++){const id=String(n).padStart(3,'0');const c=document.createElement('div');c.className='card';c.innerHTML=`<span class="tag">FRAME ${id}</span><img src="assets/mobs/frame_${id}.png" alt="Frame ${id}"><span class="meta">frame_${id}.png</span>`;grid.appendChild(c)}</script></body></html>
