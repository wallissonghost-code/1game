<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d15"><title>1Game · Batalha</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#080b12;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}body{position:fixed;inset:0;touch-action:manipulation;user-select:none}.game{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(188px,28vh);background:#0b111b}.hud{z-index:4;padding:max(7px,env(safe-area-inset-top)) 8px 5px;background:#080d16;border-bottom:1px solid #ffffff15}.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:5px}.realm{font-size:9px;font-weight:950;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.realm.blue{text-align:right}.points{margin-top:1px;font-size:15px;font-weight:950}.timer{padding:6px 8px;border:1px solid #ffffff1c;border-radius:10px;background:#111927;font-weight:950;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.stat-team{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 6px;border:1px solid #ffffff10;border-radius:8px;background:#0e1520}.stat{font-size:7px;color:#8390a3}.stat b{display:block;margin-top:1px;font-size:10px;color:#fff}.battle{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 38%,#536247 0,#374a35 38%,#1b2a23 78%)}.battle:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24%,#ffffff04 24.3% 24.7%,transparent 25% 50%);pointer-events:none}.lane{position:absolute;left:0;right:0;top:46%;height:2px;background:#d8c39a1f}.clash{position:absolute;z-index:2;left:50%;top:8px;transform:translateX(-50% em;color:#eef3fb;margin-bottom:8px}.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side{position:relative;overflow:hidden;border:1px solid #ffffff17;border-radius:15px;background:linear-gradient(180deg,#131d2b,#0a111b);padding:8px;box-shadow:0 10px 26px #0006}.side.red:before,.side.blue:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.23}.side.red:before{background:radial-gradient(circle at 0 0,#ff4055,transparent 58%)}.side.blue:before{background:radial-gradient(circle at 100% 0,#3985ff,transparent 58%)}.side-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:9px;font-weight:950;letter-spacing:.13em;margin-bottom:7px}.rules{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}.rule{display:flex;align-items:center;justify-content:flex-start;gap:7px;min-width:0;height:48px;padding:5px 7px;border-radius:11px;background:#070d16d9;border:1px solid #ffffff10}.giftimg{width:36px;height:36px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 8px #0009)}.action{min-width:0;font-size:10px;font-weight:950;letter-spacing:0;white-space:nowrap}.red .action{color:#ffc3c8}.blue .action{color:#bad4ff}@keyframes fight{from{transform:translateY(-2px) rotate(-4deg)}to{transform:translateY(2px) rotate(4deg)}}@media(orientation:landscape){.game{grid-template-rows:auto minmax(0,1fr) minmax(102px,25vh)}.hud{padding-top:max(4px,env(safe-area-inset-top));padding-bottom:4px}.stats{margin-top:4px}.battle .castle.red{left:5%}.battle .castle.blue{right:5%}.livebar{padding:5px 10px max(6px,env(safe-area-inset-bottom))}.live-title{margin-bottom:5px}.rules{grid-template-columns:repeat(4,1fr);gap:5px}.side{padding:6px}.side-head{margin-bottom:4px}.rule{height:40px;padding:4px 6px}.giftimg{width:30px;height:30px}.action{font-size:9px}}@media(max-width:390px) and (orientation:portrait){.game{grid-template-rows:auto minmax(0,1fr) minmax(180px,29vh)}.livebar{padding-left:7px;padding-right:7px}.sides{gap:6px}.side{padding:6px}.rule{height:44px;padding:4px 5px;gap:5px}.giftimg{width:32px;height:32px}.action{font-size:9px}}@media(max-height:700px) and (orientation:portrait){.game{grid-template-rows:auto minmax(0,1fr) 174px}.live-title{margin-bottom:5px}.side-head{margin-bottom:4px}.rule{height:40px}.giftimg{width:29px;height:29px}.action{font-size:9px}}</style></head><body><main class="game"><header class="hud"><div class="score"><div><div class="realm">🔴 REINO DO CAOS</div><div class="points">12.450 ⚔️</div></div><div class="timer" id="timer">01:30</div><div class="realm blue">🔵 REINO DA LUZ<div class="points">11.820 ⚔️</div></div></div><div class="stats"><div class="stat-team"><div class="stat">🪖 TROPAS<b id="redUnits">0</b></div><div class="stat">☠️ MORTES<b id="redDeaths">0</b></div></div><div class="stat-team"><div class="stat">🪖 TROPAS<b id="blueUnits">0</b></div><div class="stat">☠️ MORTES<b id="blueDeaths">0</b></div></div></div></header><section class="battle" id="battle"><div class="lane"></div><div class="clash">⚔ CAMPO DE BATALHA ⚔</div><div class="castle red"><div class="tower"><i class="flag"></i></div><div class="hp"><i id="redHp"></i></div></div><div class="castle blue"><div class="tower"><i class="flag"></i></div><div class="hp"><i id="blueHp"></i></div></div></section><footer class="livebar"><div class="live-title">⚔️ ESCOLHA SEU LADO</div><div class="sides"><section class="side red"><div class="side-head">🔴 CAOS</div><div class="rules"><div class="rule"><img class="giftimg" alt="Rose" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp"><div class="action">+1 MOB</div></div><div class="rule"><img class="giftimg" alt="Rosa" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eb77ead5c3abb6da6034d3cf6cfeb438~tplv-obj.webp"><div class="action">+3 MOB</div></div><div class="rule"><img class="giftimg" alt="Capybara" src="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/6703facdac34caefbd0617a6321afe9b.png~tplv-obj.png"><div class="action">+10 MOB</div></div><div class="rule"><img class="giftimg" alt="Cap" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/6c2ab2da19249ea570a2ece5e3377f04~tplv-obj.webp"><div class="action">+40 MOB</div></div></div></section><section class="side blue"><div class="side-head">🔵 LUZ</div><div class="rules"><div class="rule"><img class="giftimg" alt="White Rose" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/a2d81f3847457be9083a9c76a59b08cb~tplv-obj.png"><div class="action">+1 MOB</div></div><div class="rule"><img class="giftimg" alt="Tiny Diny" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/3851a489dea62b3a9fe99f61de5470ae~tplv-obj.png"><div class="action">+3 MOB</div></div><div class="rule"><img class="giftimg" alt="Doughnut" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp"><div class="action">+10 MOB</div></div><div class="rule"><img class="giftimg" alt="Hat and Mustache" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/2f1e4f3f5c728ffbfa35705b480fdc92~tplv-obj.webp"><div class="action">+40 MOB</div></div></div></section></div></footer></main><script>(()=>{'use strict';const battle=document.getElementById('battle');let units=[],last=performance.now(),spawnClock=0,time=90,redHp=100,blueHp=100,redDeaths=0,blueDeaths=0;const rand=(a,b)=>a+Math.random()*(b-a);const redUnits=document.getElementById('redUnits'),blueUnits=document.getElementById('blueUnits'),redDeathsEl=document.getElementById('redDeaths'),blueDeathsEl=document.getElementById('blueDeaths'),redHpEl=document.getElementById('redHp'),blueHpEl=document.getElementById('blueHp'),timer=document.getElementById('timer');function spawn(team,n=1){for(let k=0;k<n;k++){const el=document.createElement('div');el.className='unit '+team;el.innerHTML='<i class="h"></i><i class="b"></i><i class="s"></i>';battle.appendChild(el);units.push({el,team,x:team==='red'?68:battle.clientWidth-88,y:rand(24,battle.clientHeight-48),hp:3,atk:0,speed:rand(12,19),counted:false})}update()}function update(){redUnits.textContent=units.filter(u=>u.team==='red'&&u.hp>0).length;blueUnits.textContent=units.filter(u=>u.team==='blue'&&u.hp>0).length;redDeathsEl.textContent=redDeaths;blueDeathsEl.textContent=blueDeaths}function kill(u){if(u.counted)return;u.counted=true;u.team==='red'?redDeaths++:blueDeaths++;u.el.classList.add('dead');update();setTimeout(()=>{u.el.remove();update()},350)}function hitCastle(team,d){if(team==='red'){redHp=Math.max(0,redHp-d);redHpEl.style.width=redHp+'%'}else{blueHp=Math.max(0,blueHp-d);blueHpEl.style.width=blueHp+'%'}}function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;spawnClock+=dt;if(spawnClock>3.2){spawnClock=0;spawn('red',2);spawn('blue',2)}for(const u of units){if(u.hp<=0)continue;let enemy=null,best=999;for(const v of units){if(v.hp<=0||v.team===u.team)continue;const d=Math.hypot(v.x-u.x,v.y-u.y);if(d<best){best=d;enemy=v}}u.atk-=dt;if(enemy&&best<23){u.el.classList.add('fight');if(u.atk<=0){u.atk=.55;enemy.hp--;if(enemy.hp<=0)kill(enemy)}}else{u.el.classList.remove('fight');const dir=u.team==='red'?1:-1;u.x+=dir*u.speed*dt;if((u.team==='red'&&u.x>battle.clientWidth-70)||(u.team==='blue'&&u.x<52)){hitCastle(u.team==='red'?'blue':'red',.12);u.x-=dir*7}if(enemy&&best<75)u.y+=(enemy.y-u.y)*dt*.7}u.el.style.left=u.x+'px';u.el.style.top=u.y+'px'}units=units.filter(u=>u.el.isConnected);requestAnimationFrame(loop)}spawn('red',7);spawn('blue',7);setInterval(()=>{time=Math.max(0,time-1);timer.textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0')},1000);requestAnimationFrame(loop);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false})})();</script></body></html>
