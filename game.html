nits=[],last=performance.now(),time=90,redHp=100,blueHp=100,redDeaths=0,blueDeaths=0,spawnSeq={red:0,blue:0},ended=false,peer=null,conn=null,retryTimer=null;const panelCode=String(sessionStorage.getItem('1game-panel-code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);let sessionToken=String(sessionStorage.getItem('1game-session-token')||'');const dist=(a,b,c,d)=>Math.hypot(a-c,b-d),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function castlePoint(team){return team==='red'?{x:50,y:battle.clientHeight*.48}:{x:battle.clientWidth-50,y:battle.clientHeight*.48}}function spawnPoint(team){const offsets=[0,-55,55,-100,100,-145,145,-25,25,-75,75],i=spawnSeq[team]++;const y=clamp(battle.clientHeight*.48+offsets[i%offsets.length],28,battle.clientHeight-38);return{x:team==='red'?72:battle.clientWidth-92,y}}function spawn(team,n=1){n=Math.max(0,Math.min(200,Number(n)||0));for(let k=0;k<n;k++){const p=spawnPoint(team),el=document.createElement('div');el.className='unit '+team;el.innerHTML='<i class="h"></i><i class="b"></i><i class="s"></i>';battle.appendChild(el);units.push({el,team,x:p.x,y:p.y,hp:UNIT_HP,atk:0,counted:false,attackingCastle:false})}update();sendState()}function update(){const r=units.filter(u=>u.team==='red'&&u.hp>0).length,b=units.filter(u=>u.team==='blue'&&u.hp>0).length;redUnits.textContent=r;blueUnits.textContent=b;redDeathsEl.textContent=redDeaths;blueDeathsEl.textContent=blueDeaths;redPower.textContent=(r*POWER_PER_UNIT).toLocaleString('pt-BR')+' ⚔️';bluePower.textContent=(b*POWER_PER_UNIT).toLocaleString('pt-BR')+' ⚔️'}function kill(u){if(u.counted)return;u.counted=true;u.team==='red'?redDeaths++:blueDeaths++;u.el.classList.add('dead');update();setTimeout(()=>{u.el.remove();update()},350)}function hitCastle(team,d){if(ended)return;if(team==='red'){redHp=Math.max(0,redHp-d);redHpEl.style.width=redHp+'%'}else{blueHp=Math.max(0,blueHp-d);blueHpEl.style.width=blueHp+'%'}if(redHp<=0||blueHp<=0){ended=true;document.querySelector('.clash').textContent=redHp sessionToken||undefined})});conn.on('data',d=>{if(d?.type==='session_accept'){sessionToken=String(d.token||sessionToken);try{sessionStorage.setItem('1game-session-token',sessionToken)}catch{}setLink('PAINEL ON','on');sendManifest();return}if(d?.type==='session_reject'){setLink('RECUSADO','wait');return}runCommand(d)});conn.on('close',()=>{setLink('RECONECTANDO','wait');retryTimer=setTimeout(connectPanel,700)});conn.on('error',()=>setLink('RECONECTANDO','wait'))});peer.on('disconnected',()=>{setLink('RECONECTANDO','wait');try{peer.reconnect()}catch{}});peer.on('error',e=>{setLink('RECONECTANDO','wait');if(e?.type==='unavailable-id'||e?.type==='peer-unavailable')retryTimer=setTimeout(connectPanel,850)})}resetBattle();setInterval(()=>{if(!ended&&time>0){time--;timer.textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0')}},1000);setInterval(sendState,2500);requestAnimationFrame(loop);connectPanel();document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false})})();</script></body></html>
