<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d15"><title>1Game · Batalha</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#080b12;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}body{position:fixed;inset:0;touch-action:manipulation;user-select:none}.game{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#0b111b}.hud{z-index:4;padding:max(9px,env(safe-area-inset-top)) 10px 7px;background:#080d16;border-bottom:1px solid #ffffff15;overflow:hidden}.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}.realm{min-width:0;font-size:10px;font-weight:950;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.realm.blue{text-align:right}.points{margin-top:2px;font-size:17px;font-weight:950;white-space:nowrap}.timer{padding:7px 10px;border:1px solid #ffffff1c;border-radius:10px;background:#111927;font-weight:950;font-size:13px}.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin-top:7px}.stat-team{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;padding:5px 7px;border:1px solid #ffffff10;border-radius:9px;background:#0e1520}.stat{min-width:0;font-size:8px;color:#8390a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat b{display:block;margin-top:1px;font-size:11px;color:#fff}.battle{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#506044 0,#344532 38%,#1c2b24 75%)}.battle:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24%,#ffffff05 24.3% 24.7%,transparent 25% 50%);pointer-events:none}.lane{position:absolute;left:0;right:0;top:47%;height:3px;background:#d8c39a22}.clash{position:absolute;z-index:2;left:50%;top:12px;transform:translateX(-50%);font-size:10px;font-weight:950;letter-spacing:.16em;color:#e6d4a5;white-space:nowrap}.castle{position:absolute;top:50%;transform:translateY(-50%);width:68px;height:118px;z-index:2}.castle.red{left:3px}.castle.blue{right:3px;transform:translateY(-50%) scaleX(-1)}.tower{position:absolute;bottom:0;left:8px;width:55px;height:87px;border:3px solid #202631;background:#3b414b;border-radius:5px}.tower:before,.tower:after{content:"";position:absolute;top:-16px;width:17px;height:20px;background:#464d57;border:3px solid #202631}.tower:before{left:-3px}.tower:after{right:-3px}.flag{position:absolute;top:-37px;left:28px;width:3px;height:37px;background:#c8cbd0}.flag:after{content:"";position:absolute;top:0;left:3px;width:27px;height:16px;background:#d94848;clip-path:polygon(0 0,100% 25%,0 100%)}.blue .flag:after{background:#4c8cff}.hp{position:absolute;bottom:-13px;left:5px;width:58px;height:5px;border-radius:5px;background:#151922;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#6fe28d}.unit{position:absolute;width:22px;height:31px;z-index:3}.unit .h{position:absolute;left:6px;top:0;width:10px;height:10px;border-radius:50%;background:#d6ad86;border:2px solid #171c25}.unit .b{position:absolute;left:4px;top:9px;width:14px;height:15px;border-radius:5px;background:#c43d46;border:2px solid #171c25}.unit.blue .b{background:#3c73ce}.unit .s{position:absolute;right:-2px;top:10px;width:11px;height:3px;background:#d5d9df;transform:rotate(-35deg);transform-origin:left}.unit.blue .s{right:auto;left:-2px;transform:rotate(215deg)}.unit.fight{animation:fight .24s ease-in-out infinite alternate}.unit.dead{opacity:0;transform:rotate(70deg) scale(.6)!important;transition:.35s}.livebar{z-index:5;background:#080d16;border-top:1px solid #ffffff16;padding:7px 8px max(8px,env(safe-area-inset-bottom));overflow:hidden}.livebar-title{font-size:8px;font-weight:950;letter-spacing:.16em;color:#f6a34b;margin:0 3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gifts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:1px}.gifts::-webkit-scrollbar{display:none}.gift{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:43px;min-width:122px;padding:5px 9px;border:1px solid #ffffff16;border-radius:11px;background:#111925}.gift-icon{font-size:20px}.gift-copy{min-width:0;line-height:1.08}.gift-name{font-size:8px;font-weight:900;color:#aab4c3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift-effect{font-size:9px;font-weight:950;color:#fff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift:first-child .gift-effect{color:#c8a8ff}.live-event{height:18px;margin-top:5px;padding:2px 3px;font-size:8px;color:#8d98a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@keyframes fight{from{transform:translateY(-2px) rotate(-4deg)}to{transform:translateY(2px) rotate(4deg)}}@media (orientation:portrait){.hud{padding-left:8px;padding-right:8px}.realm{font-size:8.5px;letter-spacing:.035em}.points{font-size:15px}.timer{font-size:12px;padding:6px 8px}.stats{gap:5px}.stat-team{padding:5px}.stat{font-size:7px}.stat b{font-size:10px}.clash{font-size:8.5px;letter-spacing:.12em}.gifts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;overflow:hidden;touch-action:none}.gift{width:auto;min-width:0;height:38px;padding:4px 6px;gap:5px}.gift-icon{font-size:17px}.gift-name{font-size:7px}.gift-effect{font-size:8px}.livebar-title{font-size:7px;letter-spacing:.12em}.live-event{height:14px;margin-top:3px;font-size:7px}}@media (orientation:landscape) and (min-width:700px){.castle.red{left:5%}.castle.blue{right:5%}}</style></head><body><main class="game"><header class="hud"><div class="score"><div><div class="realm">🔴 REINO DO CAOS</div><div class="points">12.450 ⚔️</div></div><div class="timer" id="timer">01:30</div><div class="realm blue">🔵 REINO DA LUZ<div class="points">11.820 ⚔️</div></div></div><div class="stats"><div class="stat-team"><div class="stat">🪖 TROPAS<b id="redUnits">0</b></div><div class="stat">☠️ MORTES<b id="redDeaths">0</b></div></div><div class="stat-team"><div class="stat">🪖 TROPAS<b id="blueUnits">0</b></div><div class="stat">☠️ MORTES<b id="blueDeaths">0</b></div></div></div></header><section class="battle" id="battle"><div class="lane"></div><div class="clash">⚔ CAMPO DE BATALHA ⚔</div><div class="castle red"><div class="tower"><i class="flag"></i></div><div class="hp"><i id="redHp"></i></div></div><div class="castle blue"><div class="tower"><i class="flag"></i></div><div class="hp"><i id="blueHp"></i></div></div></section><footer class="livebar"><div class="livebar-title">🔥 PRESENTES DA LIVE · INTERAJA E MUDE A BATALHA</div><div class="gifts"><div class="gift"><span class="gift-icon">🎮</span><div class="gift-copy"><div class="gift-name">GG</div><div class="gift-effect">+5 GUERREIROS</div></div></div><div class="gift"><span class="gift-icon">🌹</span><div class="gift-copy"><div class="gift-name">ROSA</div><div class="gift-effect">+2 GUERREIROS</div></div></div><div class="gift"><span class="gift-icon">🦖</span><div class="gift-copy"><div class="gift-name">DINOSSAURO</div><div class="gift-effect">TROPA ESPECIAL</div></div></div><div class="gift"><span class="gift-icon">🎁</span><div class="gift-copy"><div class="gift-name">PRESENTE</div><div class="gift-effect">EFEITO ESPECIAL</div></div></div></div><div class="live-event" id="events">⚔️ A batalha começou.</div></footer></main><script>(()=>{'use strict';const battle=document.getElementById('battle');let units=[],last=performance.now(),spawnClock=0,time=90,redHp=100,blueHp=100,redDeaths=0,blueDeaths=0;const rand=(a,b)=>a+Math.random()*(b-a);function spawn(team,n=1){for(let k=0;k<n;k++){const el=document.createElement('div');el.className='unit '+team;el.innerHTML='<i class="h"></i><i class="b"></i><i class="s"></i>';battle.appendChild(el);units.push({el,team,x:team==='red'?75:battle.clientWidth-97,y:rand(30,battle.clientHeight-58),hp:3,atk:0,speed:rand(12,19),counted:false})}update()}function update(){document.getElementById('redUnits').textContent=units.filter(u=>u.team==='red'&&u.hp>0).length;document.getElementById('blueUnits').textContent=units.filter(u=>u.team==='blue'&&u.hp>0).length;document.getElementById('redDeaths').textContent=redDeaths;document.getElementById('blueDeaths').textContent=blueDeaths}function kill(u){if(u.counted)return;u.counted=true;u.team==='red'?redDeaths++:blueDeaths++;u.el.classList.add('dead');update();setTimeout(()=>{u.el.remove();update()},350)}function hitCastle(team,d){if(team==='red'){redHp=Math.max(0,redHp-d);document.getElementById('redHp').style.width=redHp+'%'}else{blueHp=Math.max(0,blueHp-d);document.getElementById('blueHp').style.width=blueHp+'%'}}function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;spawnClock+=dt;if(spawnClock>3.2){spawnClock=0;spawn('red',2);spawn('blue',2)}for(const u of units){if(u.hp<=0)continue;let enemy=null,best=999;for(const v of units){if(v.hp<=0||v.team===u.team)continue;const d=Math.hypot(v.x-u.x,v.y-u.y);if(d<best){best=d;enemy=v}}u.atk-=dt;if(enemy&&best<25){u.el.classList.add('fight');if(u.atk<=0){u.atk=.55;enemy.hp--;if(enemy.hp<=0)kill(enemy)}}else{u.el.classList.remove('fight');const dir=u.team==='red'?1:-1;u.x+=dir*u.speed*dt;if((u.team==='red'&&u.x>battle.clientWidth-79)||(u.team==='blue'&&u.x<58)){hitCastle(u.team==='red'?'blue':'red',.12);u.x-=dir*8}if(enemy&&best<80)u.y+=(enemy.y-u.y)*dt*.7}u.el.style.left=u.x+'px';u.el.style.top=u.y+'px'}units=units.filter(u=>u.el.isConnected);requestAnimationFrame(loop)}spawn('red',7);spawn('blue',7);setInterval(()=>{time=Math.max(0,time-1);document.getElementById('timer').textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0')},1000);requestAnimationFrame(loop);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});window.addEventListener('resize',()=>units.forEach(u=>u.x=Math.min(u.x,battle.clientWidth-25)))})();</script></body></html>
